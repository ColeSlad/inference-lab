[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-lab"
version = "0.1.0"
description = "A reproducible LLM serving and benchmarking lab for comparing inference backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cole Sladowsky" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
hf = [
  "torch>=2.4,<3.0",
  "transformers>=4.47,<6.0",
  "accelerate>=1.0,<2.0",
]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0",
]
plots = [
  "matplotlib>=3.9,<4.0",
]

[project.scripts]
inference-lab-bench = "inference_lab.benchmark.runner:main"
inference-lab-evaluate = "inference_lab.benchmark.gate:main"
inference-lab-inspect-dataset = "inference_lab.benchmark.dataset_tokens:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
